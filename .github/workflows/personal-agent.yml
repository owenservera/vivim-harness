name: Personal Agent focused checks
on:
  pull_request:
    paths:
      - 'src/agents/**'
      - 'src/studio/personal-agent-routes.mjs'
      - 'src/studio/integration-hub.mjs'
      - 'src/studio/server.mjs'
      - 'src/studio/ui/personal-agent.*'
      - 'bin/commands/personal-agent.mjs'
      - 'bin/studio.mjs'
      - 'test/unit/personal-agent-*.test.mjs'
      - '.github/workflows/personal-agent.yml'
  push:
    branches: [main]
    paths:
      - 'src/agents/**'
      - 'src/studio/personal-agent-routes.mjs'
      - 'src/studio/ui/personal-agent.*'
      - 'test/unit/personal-agent-*.test.mjs'
      - '.github/workflows/personal-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-personal-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse scaffold source
        run: |
          node --check src/agents/personal-agent-bootstrap.mjs
          node --check src/agents/personal-agent-service.mjs
          node --check src/studio/personal-agent-routes.mjs
          node --check src/studio/ui/personal-agent.mjs
          node --check bin/commands/personal-agent.mjs
          node --check src/studio/server.mjs
          node --check src/studio/integration-hub.mjs
      - name: Test lifecycle, CAS, recovery, capabilities and API
        run: node --test test/unit/personal-agent-bootstrap.test.mjs test/unit/personal-agent-service.test.mjs test/unit/personal-agent-http.test.mjs test/unit/studio-ui-route-contract.test.mjs
      - name: CLI first-run and recovery smoke (temporary local data)
        run: |
          DATA_DIR="$(mktemp -d)"
          trap 'rm -rf "$DATA_DIR"' EXIT
          node bin/studio.mjs personal-agent bootstrap --data-dir "$DATA_DIR" --json > "$DATA_DIR/boot.json"
          node bin/studio.mjs personal-agent status --data-dir "$DATA_DIR" --json > "$DATA_DIR/status.json"
          node --input-type=module -e "import fs from 'node:fs'; const a=JSON.parse(fs.readFileSync(process.argv[1])); const b=JSON.parse(fs.readFileSync(process.argv[2])); if(!a.initialized || !b.initialized || a.version !== b.version) process.exit(1)" "$DATA_DIR/boot.json" "$DATA_DIR/status.json"
