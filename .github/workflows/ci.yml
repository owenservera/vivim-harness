name: VIVIM Harness verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate architecture ownership
        run: node scripts/architecture-inventory.mjs --check
      - name: Native CLI portability smoke (disposable data, no browser sends)
        run: node scripts/platform-smoke.mjs
      - name: Windows/Linux parity regression tests
        run: node --test test/unit/platform-parity.test.mjs
      - name: Capture Studio unit suite
        run: npm test
