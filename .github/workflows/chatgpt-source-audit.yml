name: ChatGPT source audit regression
on:
  push:
    branches: [main]
    paths:
      - 'src/capture/conversation-rich.mjs'
      - 'src/capture/conversation-thread.mjs'
      - 'src/capture/conversation-browser-adapter.mjs'
      - 'test/unit/conversation-rich.test.mjs'
      - 'test/unit/conversation-thread.test.mjs'
      - '.github/workflows/chatgpt-source-audit.yml'
  workflow_dispatch:
jobs:
  focused-node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused transcript, thread and read contract tests
        run: node --test test/unit/conversation-rich.test.mjs test/unit/conversation-thread.test.mjs test/unit/conversation-read-api.test.mjs
