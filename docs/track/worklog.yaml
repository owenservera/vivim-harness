    evidence: "src/studio/world-service.mjs writeNote() sets provenance user-authored, caps body at 200000 characters and requires expectedVersion; publicRecord() strips changeNote from reads; src/store/versioned.mjs adds version, savedAt and CAS_VERSION_CONFLICT; src/studio/ui/world-view.mjs interpretWrite(), conflictText(), absorbServer() and the note editor; test/unit/world-service.test.mjs CAS conflict on stale note; test/unit/world-ui.test.mjs stale save keeps the same draft; test/unit/world-relations.test.mjs note comments on a selection"
    gap: "Author is only the literal string user-authored, with no author identity recorded. Revision history is not exposed: the UI shows a version number and savedAt only, and changeNote is stripped from every read. Correction is only commentsOn pointing at a selection, with no correction-of-observation relation."
    depends_on: ["W05"]
