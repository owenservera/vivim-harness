    title: "User-owned project and association overlay"
    outcome_contract: "Create a project and associate a conversation, part or artifact, link and unlink without destructive source writes, with durable edits."
    current_status: implemented_uncommitted
    evidence: "src/studio/world-service.mjs createProject(), updateProject() with memberIds validated through relations.validateRefs and removed members not required to still exist, writeNote(), createObject(), createSelection(); src/studio/world-relations.mjs ref(), validate(), createSelection(); src/store/versioned.mjs VersionedStore compareAndSave with appended versions; routes POST /world/projects and PUT /world/projects/{id}; src/studio/ui/world-view.mjs project editor with add and remove member rows; test/unit/world-service.test.mjs projects and notes persist with CAS plus unlink; test/unit/world-ui.test.mjs full edit, unlink and stale-save flow"
    gap: "Artifact association exists only as a memberIds reference to a selection of type artifact, and artifact bytes never exist. Durability is a second in-process service, not a process restart. The UI creates no objects or selections, so a part can be linked only when that record already exists."
    depends_on: ["W01", "W02"]
    evidence_grade: fixture_tested
  - id: W06
