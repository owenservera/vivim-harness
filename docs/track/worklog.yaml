# Generated by a free DeepSeek tracker session.
# Basis: static source reads plus git inspection of the working tree only.
# Evidence grades describe the strongest recorded artefact, not live proof:
# fixture_tested local HTTP/DOM tests are not browser, provider or owner-data proof.
# Nothing is committed; HEAD is 030895e79480f23e8929e4a5de5e80d74aa8c490 and every world file is uncommitted.
# Regenerate by hand from source when the working tree changes; this file is a register, not a monitor.
worklog:
  - id: W00
    title: "Baseline inventory and seam discovery"
    outcome_contract: "Observed entrypoints, physical files, test entrypoints and absent routes recorded by the implementer without a PC-wide audit."
    current_status: partial
    evidence: "docs/INTEGRATION-PROGRESS.md (State, Evidence ledger, Workstreams, Queue tables; names the world modules, test files and HEAD 030895e); architecture/components.json plus scripts/architecture-inventory.mjs (prefix-based ownership, --check); src/studio/integration-hub.mjs line 23 import registerWorldRoutes and line 112 registration; git read-only inspection shows HEAD 030895e79480f23e8929e4a5de5e80d74aa8c490 with AGENTS.md, integration-hub.mjs, ui/chat.html, ui/chat.mjs modified and six world modules, six world tests, PROMPT.md, clone-tmp/, docs/INTEGRATION-PROGRESS.md untracked"
    gap: "No route-level inventory of the /api/v1/world surface exists as a committed artefact, and the absent routes (no Find view, no Transfer view) are not enumerated as gaps."
    depends_on: []
    evidence_grade: source_only
  - id: W01
    title: "Resolve local world and identity contract"
    outcome_contract: "Distinct local world, conversation and message IDs with source refs and known or unknown account-thread mappings, imports held as foreign identity, and no probabilistic auto-merge."
    current_status: implemented_uncommitted
    evidence: "src/studio/world-service.mjs conversationId() digest of the session id, message id pattern id plus colon turn index, metadata() identity block with state unknown or partial and qualified-inference thread, qualification string, conversationMetadata() and resolve(); src/shapes/observation.mjs buildObservation() always emits account {state:unknown, ref:null} and only surfaces nativeRef via parseThread in src/capture/conversation-thread.mjs; src/studio/world-relations.mjs namespace record world-namespace, ref(), validate(); src/studio/world-transfer.mjs importedConversationId(), localId(), FOREIGN_NAMESPACE unresolved handling; test/unit/world-service.test.mjs source-scoped IDs differ across sessions; test/unit/world-relations.test.mjs qualified identity retains basis without cross-source merging; test/unit/world-restore.test.mjs restore round trip uses new IDs"
    gap: "Account identity has no known path at all, it is always unknown, so no known account-thread mapping exists. Nothing was read from real owner sessions, and the imported-id convention (a trailing f suffix on the hashed id) is a naming trick, not a tested collision defence against a local id that ends in f."
    depends_on: ["W00"]
    evidence_grade: fixture_tested
  - id: W02
    title: "Build durable offline conversation reading"
    outcome_contract: "A saved or fixture conversation reopens with no attached provider while preserving message ordering and local namespace."
    current_status: implemented_uncommitted
    evidence: "src/studio/world-service.mjs conversation(id) opens src/store/session.mjs Session.open, reads kv DOM_TURNS, emits ordered messages with source {sessionId,key,index,observedTurnId,domId} and coverage states saved-observation, partial, missing, unavailable; allMetadata() via listSessions; routes GET /world/conversations and GET /world/conversations/{id}; src/studio/ui/world-view.mjs readRecord() and renderMessages(); test/unit/world-service.test.mjs rich saved conversations survive reopen; test/unit/world-ui.test.mjs shell read of a saved conversation"
    gap: "Reopen is proven only by constructing a second service object in one process, not by restarting Studio or the host; no real saved owner data was read; the UI path was exercised only against a synthetic document."
    depends_on: ["W01"]
    evidence_grade: fixture_tested
  - id: W03
    title: "Preserve mixed native content and fidelity"
    outcome_contract: "Text, code, table, citation, artifact, unknown and partial parts read through one product UI with missing assets explicitly labelled."
    current_status: partial
    evidence: "src/studio/world-service.mjs conversation() copies turn.blocks with structuredClone and passes truncated and redactions through verbatim; src/studio/ui/world-view.mjs blockToMarkdown() handles paragraph, heading, code, table, list, quote, figure, details, rule, equation, image, file, media, graphic while unknownPart() labels strangers without copying payloads, turnPlan() and coverageView(); rendering reuses rich.renderStatic from createRichRenderer in src/studio/ui/chat.mjs; test/unit/world-ui.test.mjs plan test proves the opaque payload is not leaked; test/unit/world-service.test.mjs proves unknown blocks survive reopen"
    gap: "Citation, chart and artifact parts degrade to labelled non-content, so the contract line about reading artifact parts is unmet. Image and file bytes are never stored, so fidelity stops at labels. No process restart, no browser render, and vivim-final/src/schema/streaming.ts named as a source does not exist in this checkout."
    depends_on: ["W01"]
    evidence_grade: fixture_tested
  - id: W04
    title: "Source evidence and authority provenance bridge"
    outcome_contract: "Derived and imported items trace to a captured origin or are marked unavailable, and user edits never overwrite evidence."
    current_status: implemented_uncommitted
